<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenish</title>
  <link rel="shortcut icon" href="../img/logo_s_NEWcopy.png" type="image/x-icon">

  <link rel="stylesheet" href="../css/login.css">

  <!--jQuery-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
  <script>
    Kakao.init('743967072e0b8d3d4fc0e29e047e5c4a'); // JavaScript Key
    console.log("Kakao SDK initialized:", Kakao.isInitialized()); // true 확인
  </script> <!--카카오-->
  <script src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.0.js"></script> <!--네이버-->

  <script src="../js/login.js"></script>


  <!--google font cdn-->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0;
      font-family: "Nanum Gothic", sans-serif; font-size: 14px;
    }
    li {list-style: none;}
    a {color: black; text-decoration: none;}
    input, label {vertical-align: middle; margin: 0;}
    input[type="checkbox"] {accent-color: #00980A;}


  </style>
</head>

<body>

  <div class="login">
    <div class="login_container">
      <p class="main_title">로그인</p>
      <form action="#" method="post">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" required placeholder="아이디를 입력하세요">

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required placeholder="비밀번호를 입력하세요">

        <div class="check">
          <label><input type="checkbox" id="id_chk">아이디 저장</label>
          <label><input type="checkbox" id="login_chk">자동 로그인</label>
        </div> <!--check-->

        <button class="login_btn" type="submit">로그인</button>
        <div class="add">
          <a href="../html/find.html">아이디/비밀번호 찾기</a>
          <a href="./join.html">회원가입</a>
        </div> <!--add-->

        <div class="sns_join">
          <p>sns 계정으로 간편 로그인 하기</p>
          <div class="sns">
            <a href="#!" class="kakao"></a>
            <a href="#!" class="naver"></a>
            <a href="#!" class="google"></a>
          </div>
        </div>
      </form>
    </div> <!--login-container-->
  </div><!--login-->


  <div id="toast"></div>

</body>

</html>
